name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Bootstrap pinned RTK
        shell: python
        run: |
          import runpy, sys
          sys.argv = ['ci_bootstrap.py', '--tool', 'rtk']
          runpy.run_path('scripts/ci_bootstrap.py', run_name='__main__')
      - name: Install locked SDK
        run: rtk proxy python -m pip install --require-hashes -r requirements.lock
      - name: Complete regression and transport checks
        run: rtk proxy python scripts/guards/workspace-budget.py --temp-gib 0.1 run . -- rtk proxy python scripts/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-proofs
          retention-days: 7
          if-no-files-found: error
          path: |
            output/task-tmp/validation.json
            output/task-tmp/tests.log
            output/task-tmp/benchmark.json
            output/task-tmp/stdout.log
  security:
    name: security
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Bootstrap pinned security tools
        shell: python
        run: |
          import runpy
          runpy.run_path('scripts/ci_bootstrap.py', run_name='__main__')
      - name: Install dependency auditor
        run: rtk proxy python -m pip install pip-audit==2.10.1
      - name: Check dependencies and Git history
        run: rtk proxy python scripts/guards/workspace-budget.py --temp-gib 0.1 run . -- rtk proxy python scripts/security_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-proofs
          retention-days: 7
          if-no-files-found: error
          path: |
            output/task-tmp/dependencies.json
            output/task-tmp/secret-scan.json
            output/task-tmp/security-*.log
